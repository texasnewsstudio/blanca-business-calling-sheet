Horseshoe Bay, Texas

PROFESSIONAL SUMMARY
Venezuelan-trained attorney with extensive experience in civil, criminal, labor and constitutional law, legal drafting, legislative advisory work and university teaching. Completed advanced immigration paralegal training at the Paralegal Institute of the Americas on July 4, 2026. Strong analytical, professional writing, compliance and client service skills. Seeking legal support opportunities; not represented as licensed to practice law in the United States.

EDUCATION
Paralegal Institute of the Americas — Diploma of Completion — Immigration Paralegal Training Advanced, July 4, 2026, United States.
Universidad Santa María, Caracas, Venezuela — Law Degree, 1983–February 1992.

PROFESSIONAL EXPERIENCE
Independent Attorney, Venezuela | 1999–Present (as supplied; confirm current dates)
• Provided civil, criminal and labor legal services.
• Drafted complaints, pleadings and legal documents.
• Managed cases, advised clients, researched law and prepared case files.

Legislative Legal Advisor, Legislative Council of Vargas State, Venezuela | 2000–2001
• Advised the Health, Social Affairs and Human Rights Committee.
• Assisted in drafting state laws, the state constitution and state police regulations.
• Reviewed constitutional and regulatory compliance.

Legal Advisor, Civil Administrative Offices, Vargas, Venezuela (Catia La Mar, Raúl Leoni, Carlos Soublette) | 2002–2004
• Provided affordable legal assistance to low-income residents and supported resolution of community legal matters.

TEACHING EXPERIENCE
Universidad Bolivariana de Venezuela | Adjunct Lecturer, 2008–2013
• Taught civil law, labor law, public international law and private international law.
INCE, Caracas | Instructor, approximately 2008
• Taught sports legislation and trained coaches for international programs.
Universidad Nacional Experimental de la Seguridad | Lecturer, 2015
• Taught legal subjects to police officers and security professionals.

SKILLS
Legal drafting, legal research (case law, scholarship and judgments), legislative analysis, client service, professional communication, computer-assisted drafting and research, native Spanish. Experienced in applying legal rules to individual cases and institutional and social needs.</textarea><button id="copyCv" onclick="copy(document.getElementById('cv').value)"></button> <button id="saveCv" onclick="localStorage.setItem('legal_cv_v1',document.getElementById('cv').value)"></button></details></section><section><h2 id="listTitle"></h2><div id="list"></div><button id="backup" onclick="backup()"></button></section></main><script>

h progress'));$('progressNote').textContent=tr('Cada contacto es un paso adelante. Las ofertas de empleo se cuentan por separado.','Every contact is a step forward. Job offers are counted separately.');const list=$('list');list.replaceChildren();$('stats').replaceChildren();for(const [label,n] of [[tr('Bufetes','Law firms'),firms.length],[tr('Contactados','Contacted'),firms.filter(f=>records[f.id]?.status&&records[f.id].status!=='pending').length],[tr('Seguimientos','Follow-ups'),firms.filter(f=>records[f.id]?.status==='followup').length],[tr('Ofertas de empleo','Job offers'),firms.filter(f=>records[f.id]?.status==='offer').length],[tr('No interesados','Not interested'),firms.filter(f=>records[f.id]?.status==='declined').length]]){const d=document.createElement('div');d.className='stat';d.textContent=n+' · '+label;$('stats').append(d)}for(const f of firms){const r=records[f.id]||={};records[f.id]=r;const status=statuses.includes(r.status)?r.status:'pending';if($('filter').value!=='all'&&$('filter').value!==status)continue;if(!(f.name+' '+f.city).toLowerCase().includes($('search').value.toLowerCase()))continue;const a=document.createElement('article');a.className='firm';a.style.borderLeftColor=colors[statuses.indexOf(status)];a.id='firm'+f.id;const d=document.createElement('details');d.open=selected===f.id;const h=document.createElement('summary');h.textContent=f.name+' · '+labels()[statuses.indexOf(status)];if(status==='declined'){h.style.textDecoration='line-through';h.style.color='#fca5a5';a.style.background='#321c28';}d.append(h);if(status==='declined'){const stop=document.createElement('p');stop.textContent=tr('✕ NO VOLVER A LLAMAR','✕ DO NOT CALL AGAIN');stop.style.cssText='color:#fca5a5;font-weight:bold;font-size:1.2rem';d.append(stop)}const p=document.createElement('p');p.textContent=f.city+' · '+f.phone;d.append(p);const call=document.createElement('a');call.href='tel:'+f.phone;call.textContent=tr('Llamar','Call');if(status!=='declined')d.append(call);const
